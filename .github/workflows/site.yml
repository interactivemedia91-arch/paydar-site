# Builds getpaydarapp.com from content/ + the shared prices.json and deploys it to GitHub Pages.
# Runs on every push to main and once a day, so "coming up" price increases flip to "in effect"
# on their date. A failed run keeps the last deployed site, and GitHub emails the repo owner.
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test
        run: python3 -I -m unittest discover -s tools/tests -t tools

      - name: Build
        run: python3 -I tools/build.py

      # GitHub disables scheduled workflows in public repos after 60 days without activity.
      - name: Keepalive
        if: github.event_name == 'schedule'
        continue-on-error: true  # a failed keepalive push must not block the day's deploy
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 24 * 3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # After a push (new or changed pages), tells Bing and the other IndexNow engines to recrawl the
  # sitemap's pages. The key is public by design: static/<key>.txt proves the site owns it.
  indexnow:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        continue-on-error: true  # a failed ping must not fail the deploy
        env:
          KEY: b1ac0f758eec2a13270245f046b2db71
        run: |
          urls=$(curl -fsS https://getpaydarapp.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" '{host: "getpaydarapp.com", key: env.KEY, keyLocation: ("https://getpaydarapp.com/" + env.KEY + ".txt"), urlList: $urls}' \
            | curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data-binary @- -o /dev/null -w 'IndexNow: HTTP %{http_code}\n'
